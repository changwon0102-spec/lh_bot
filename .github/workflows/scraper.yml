name: Youth housing alerts

on:
  schedule:
    # UTC 00:00 / 09:00 = Asia/Seoul 09:00 / 18:00
    - cron: '0 0,9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Crawl/parse only; no DB writes, LLM calls, or Telegram messages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: youth-housing-alerts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Crawl and notify
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python main.py
